services:
  raw-material:
    image: raw-material-image
    container_name: raw-material
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5005:5005"
    environment:
      PORT: "5005"
      DATABASE_PATH: /data/app.db
      SECRET_KEY: dev-secret-key
    volumes:
      - raw-material-data:/data

volumes:
  raw-material-data:
