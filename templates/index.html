{% extends "base.html" %}
{% block content %}
<div class="row g-4">
  <div class="col-12">
    <div class="card soft-card">
      <div class="card-body">
        <h1 class="h3 mb-2">Products</h1>
        <p class="muted-small mb-0">Enter the quantity you want to process for each product, then click Process.</p>
      </div>
    </div>
  </div>

  <div class="col-12">
    <form method="post" action="{{ url_for('process') }}">
      <div class="card soft-card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover table-fixed align-middle">
              <thead class="table-light">
                <tr>
                  <th style="width: 18%;">Stock Code</th>
                  <th>Product Name</th>
                  <th style="width: 18%;">Quantity</th>
                </tr>
              </thead>
              <tbody>
                {% for product in products %}
                <tr>
                  <td>{{ product.stock_code }}</td>
                  <td>{{ product.product_name }}</td>
                  <td>
                    <input class="form-control" name="qty_{{ product.id }}" placeholder="0">
                  </td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
        <div class="card-footer bg-white border-0 p-3 d-flex justify-content-end">
          <button type="submit" class="btn btn-primary btn-lg px-4">Process</button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
